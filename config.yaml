# ==================== MULTI-CAMERA RTSP + AI PIPELINE ====================
# Root configuration file

cameras:
  - id: cam01
    rtsp: "rtsp://admin:1234567Chuong@192.168.1.254:554/cam/realmonitor?channel=1&subtype=1"
  - id: cam02
    rtsp: "rtsp://admin:123456Chuong@192.168.1.253:554/cam/realmonitor?channel=1&subtype=1"
  - id: cam03
    rtsp: "rtsp://admin:12345678Chuong@192.168.1.204:554/cam/realmonitor?channel=1&subtype=1"

ai:
  enabled: true
  frame_interval: 3          # Process every N frames (1 = all frames)
  det_conf: 0.7              # Detection confidence threshold
  resize_for_inference: 0.5  # Resize factor before inference (0.5 = half size)
  model:
    detector_onnx_path: "./models/pretrained_models/yolov4-tiny.onnx"
    classes_path: "./models/pretrained_models/coco.names"
  reid:
    enabled: false           # ReID disabled by default for performance
    feature_onnx_path: "./models/pretrained_models/osnet_ain_x1_0_M.onnx"
    similarity_threshold: 0.42

annotate:
  draw_boxes: true
  draw_labels: true
  draw_fps: true
  draw_latency: true
  box_color: [0, 255, 0]     # BGR format
  text_color: [255, 255, 255]
  box_thickness: 2
  font_scale: 0.6

restream:
  rtsp_base: "rtsp://127.0.0.1:8554"
  fps: 15
  resolution: [1280, 720]
  codec: "h264"
  preset: "veryfast"
  tune: "zerolatency"
  bitrate: "2M"

livekit:
  # Use LAN IP to match ICE candidate advertisement (see infra/livekit/docker-compose.yml NODE_IP)
  url: "ws://192.168.1.247:7880"
  api_key: "devkey"
  api_secret: "devsecret"
  room: "multicam"

api:
  host: "0.0.0.0"
  port: 8080

logging:
  level: "INFO"
  dir: "./logs"
