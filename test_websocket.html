<!DOCTYPE html>
<html>
<head>
    <title>Test WebSocket Stream</title>
    <style>
        body { 
            background: #000; 
            color: #fff; 
            font-family: Arial;
            padding: 20px;
        }
        .video-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .video-box {
            border: 2px solid #333;
            padding: 10px;
            background: #111;
        }
        img {
            max-width: 640px;
            display: block;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            background: #222;
            border-radius: 5px;
        }
        .connected { color: #0f0; }
        .disconnected { color: #f00; }
    </style>
</head>
<body>
    <h1>WebSocket Camera Stream Test</h1>
    
    <div class="status">
        <div>Backend: <span id="backend-status" class="disconnected">Not Connected</span></div>
    </div>

    <div class="video-container">
        <div class="video-box">
            <h3>Camera 01</h3>
            <div id="status-cam01" class="disconnected">Connecting...</div>
            <img id="stream-cam01" alt="Camera 01" />
            <div>Frames: <span id="frames-cam01">0</span></div>
        </div>

        <div class="video-box">
            <h3>Camera 02</h3>
            <div id="status-cam02" class="disconnected">Connecting...</div>
            <img id="stream-cam02" alt="Camera 02" />
            <div>Frames: <span id="frames-cam02">0</span></div>
        </div>

        <div class="video-box">
            <h3>Camera 03</h3>
            <div id="status-cam03" class="disconnected">Connecting...</div>
            <img id="stream-cam03" alt="Camera 03" />
            <div>Frames: <span id="frames-cam03">0</span></div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'ws://localhost:5000';
        const cameras = ['cam01', 'cam02', 'cam03'];
        const frameCounts = { cam01: 0, cam02: 0, cam03: 0 };

        // Test REST API first
        fetch('http://localhost:5000/api/cameras')
            .then(res => res.json())
            .then(data => {
                document.getElementById('backend-status').textContent = 'Connected';
                document.getElementById('backend-status').className = 'connected';
                console.log('Cameras:', data);
            })
            .catch(err => {
                document.getElementById('backend-status').textContent = 'Failed: ' + err.message;
                console.error('Backend error:', err);
            });

        // Connect to each camera
        cameras.forEach(camId => {
            const ws = new WebSocket(`${BACKEND_URL}/ws/tracking/${camId}`);
            const imgElement = document.getElementById(`stream-${camId}`);
            const statusElement = document.getElementById(`status-${camId}`);
            const frameCounter = document.getElementById(`frames-${camId}`);

            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                console.log(`[${camId}] WebSocket connected`);
                statusElement.textContent = 'Connected';
                statusElement.className = 'connected';
            };

            ws.onmessage = (event) => {
                frameCounts[camId]++;
                frameCounter.textContent = frameCounts[camId];

                // Convert binary to image
                const blob = new Blob([event.data], { type: 'image/jpeg' });
                const url = URL.createObjectURL(blob);
                
                // Revoke old URL to prevent memory leak
                if (imgElement.src) {
                    URL.revokeObjectURL(imgElement.src);
                }
                
                imgElement.src = url;
            };

            ws.onerror = (error) => {
                console.error(`[${camId}] WebSocket error:`, error);
                statusElement.textContent = 'Error';
                statusElement.className = 'disconnected';
            };

            ws.onclose = (event) => {
                console.log(`[${camId}] WebSocket closed:`, event.code, event.reason);
                statusElement.textContent = `Disconnected (${event.code})`;
                statusElement.className = 'disconnected';
            };
        });
    </script>
</body>
</html>
